include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/player-api
  TgsSettingKey: player-api
  BuildCacheKey: Tgs.PlayerService.$CI_PIPELINE_IID
  HelmTemplateFolderName: player-api

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  variables:
    Framework: net7.0
  extends: .unit-test-template

push-nuget:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.PlayerService.Client/Tgs.PlayerService.Client.csproj" --no-restore
    - dotnet nuget push "Tgs.PlayerService.Client/bin/$BuildConfiguration/*.nupkg" --source "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.PlayerService.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  variables:
    project: Tgs.PlayerService/Tgs.PlayerService.csproj

push-k8s-template:
  extends: .push-k8s-template

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: always

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
