variables: 
  ImageName: pgtgs/player-api
  TgsSettingKey: player-api

stages:
  - build
  - test
  - publish
  - deploy

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  artifacts:
    untracked: true
    expire_in: "1 days"

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - job: build-code
      artifacts: true
  only:
    - merge_requests
    - main
  artifacts:
    when: always
    reports:
      junit: ./src/Tests/TestReports/*-TestReport.xml

push-nuget:
  stage: publish
  needs:
    - job: build-code
      artifacts: true
    - unit-test
  only:
    - main
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.PlayerService.Client/Tgs.PlayerService.Client.csproj" --no-restore
    - dotnet nuget push "Tgs.PlayerService.Client/bin/$BuildConfiguration/*.nupkg" --source "raypro-baget" -k $NugetApiKey --skip-duplicate

push-docker-image:
  stage: publish
  needs:
    - job: build-code
      artifacts: true
    - unit-test
  only:
    - main
  script:
    export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M)-dev.$CI_PIPELINE_IID"
    - dotnet build "Tgs.PlayerService/Tgs.PlayerService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageName:$Tag" --no-restore
    - docker push $ImageName:$Tag

push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/player-api artifacts/k8s/
  artifacts:
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables: 
    GIT_STRATEGY: none
    namespace: dev
  stage: deploy
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M)-$namespace.$CI_PIPELINE_IID"
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/player-api \
        -n $namespace \
        --set image.tag=$Tag \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/player-api \
        -n $namespace \
        --set image.tag=$Tag \
        -f - \
        | kubectl -n dev apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF

deploy-staging:
  variables: 
    GIT_STRATEGY: none
    namespace: staging
  stage: deploy
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_staging
  script:
